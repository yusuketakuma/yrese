name: CI

on:
  push:
    branches: [main, feat/operator-first-ui]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.4@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
        env:
          POSTGRES_DB: yrese_ci
          POSTGRES_USER: yrese_ci
          POSTGRES_PASSWORD: yrese_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yrese_ci -d yrese_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.18.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.6.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test
        env:
          TEST_DATABASE_URL: postgresql://yrese_ci:yrese_ci_test@127.0.0.1:5432/yrese_ci

      - name: Test repository scripts
        run: pnpm test:scripts

      - name: Build
        run: pnpm -r build

      - name: Check OpenAPI generation drift
        run: pnpm check:openapi

      - name: Check secrets
        run: pnpm check:secrets

      - name: Check dependency vulnerabilities
        run: pnpm check:deps

      - name: Check SBOM
        run: pnpm check:sbom

      - name: Check boundaries
        run: pnpm check:boundaries

      - name: Check calculation purity
        run: pnpm check:calculation-purity

      - name: Check SSOT index
        run: pnpm check:ssot-index
