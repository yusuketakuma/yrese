    MigrationStateResponse:
      oneOf:
        - type: object
          properties:
            available:
              type: boolean
              const: true
            result:
              type: string
              enum:
                - up_to_date
                - db_ahead
                - version_mismatch
                - checksum_mismatch
                - name_mismatch
                - unapplied_required
            appliedCount:
              type: integer
              minimum: 0
