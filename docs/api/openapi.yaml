            minLength: 1
            maxLength: 128
          required: true
        - in: query
          name: date
          schema:
            type: string
            format: date
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
          required: true
      responses:
        "200":
          description: Current server-saved prescription draft
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrescriptionDraftResponse"
        "204":
          description: Verified reception context has no server-saved prescription draft
          headers: *a1
        "400":
          description: Invalid prescription draft request
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrameworkErrorResponse"
        "403":
          description: Forbidden (AUTH-0003)
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Verified reception context not found
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrameworkErrorResponse"
        "500":
          description: Normalized internal error. Constant invariant message; no raw exception detail, no PHI.
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrameworkErrorResponse"
    put:
      operationId: savePrescriptionDraftByReception
      tags:
        - prescriptions
      summary: Create or update a versioned prescription draft
      description: "Requires prescription:write, reception:read, and patient:read. Uses expectedVersion for optimistic
        concurrency. A 409 never echoes the current clinical payload. Every status uses Cache-Control: no-store."
      x-yrese-ssot: DOM-002
      x-yrese-required-scopes:
        - prescription:write
        - reception:read
        - patient:read
      parameters:
        - in: path
          name: receptionId
          schema:
            type: string
            minLength: 1
            maxLength: 128
          required: true
        - in: header
          name: if-match
          schema:
            type: string
            maxLength: 12
            pattern: ^"[1-9][0-9]*"$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrescriptionDraftSaveRequest"
      responses:
        "200":
          description: Prescription draft updated or unchanged
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrescriptionDraftSaveResponse"
        "201":
          description: Prescription draft created
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrescriptionDraftSaveResponse"
        "400":
          description: Invalid prescription draft request
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrameworkErrorResponse"
        "403":
          description: Forbidden (AUTH-0003)
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Verified reception and patient context not found
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrameworkErrorResponse"
        "409":
          description: Prescription draft version conflict
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrameworkErrorResponse"
        "500":
          description: Normalized internal error. Constant invariant message; no raw exception detail, no PHI.
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrameworkErrorResponse"
  /operations/outbox-summary:
    get:
      operationId: getOperationsOutboxSummary
      tags:
        - operations
      summary: Return transactional outbox counters for the authenticated tenant and pharmacy
      description: "Requires sync:read scope. Returns counts and instants derived from persisted outbox intents
        (migrations/000005 + 000007 `outbox_events`; the in-memory mode reads the in-process intent store). No delivery
        worker runs in this slice, so intents observed as pending are genuinely pending. The response is PHI-free —
        counts, event-type labels, and one instant only — so it declares no Cache-Control: no-store. `legacyOrphanCount`
        is omitted where it is not derived rather than reported as zero, and the orphan reception IDs themselves are
        never returned."
      x-yrese-ssot: MOD-009
      x-yrese-required-scope: sync:read
      responses:
        "200":
          description: Outbox counters grouped by event type in eventType asc order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboxSummaryResponse"
        "403":
          description: Forbidden (AUTH-0003)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Normalized internal error. Constant invariant message; no raw exception detail, no PHI.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrameworkErrorResponse"
  /operations/reception-summary:
    get:
      operationId: getOperationsReceptionSummary
      tags:
        - operations
      summary: Return reception counts for one explicit calendar date
      description: "Requires reception:read only. patient:read is deliberately not required: the service folds the reception
        list into counts before the route sees it, so no patient identity crosses the route boundary and a batch screen
        does not need a patient scope. Both count arrays list every enum member in declaration order, so an absent
        status is reported as a measured zero rather than being dropped. The response is PHI-free and declares no
        Cache-Control: no-store."
      x-yrese-ssot: API-006
      x-yrese-required-scope: reception:read
      parameters:
        - in: query
          name: date
          schema:
            type: string
            format: date
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
          required: true
      responses:
        "200":
          description: Reception counts by reception status and eligibility status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceptionSummaryResponse"
        "400":
          description: Invalid reception summary query (RCV-0001)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden (AUTH-0003)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Normalized internal error. Constant invariant message; no raw exception detail, no PHI.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrameworkErrorResponse"
  /operations/migration-state:
    get:
      operationId: getOperationsMigrationState
      tags:
        - operations
      summary: Return the schema_migrations reconciliation state
      description: "Requires tenant:admin scope. Reuses the same reconciliation the db:check CLI and the startup gate use
        (checkMigrationState over migrations/000001 `schema_migrations`). Returns the reconciliation result,
        applied/available counts, the derived pending versions, and the latest applied version and name.
        `pendingVersions` is omitted where the reconciliation stopped before it could be derived rather than reported as
        zero. Never returns DATABASE_URL, a connection string, a host name, or a checksum value. When no persistent
        store is configured the response is the explicit `available: false` branch rather than a fabricated up-to-date
        state."
      x-yrese-ssot: DB-002
      x-yrese-required-scope: tenant:admin
      responses:
        "200":
          description: Migration reconciliation state, or the explicit not-configured branch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationStateResponse"
        "403":
          description: Forbidden (AUTH-0003)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Normalized internal error. Constant invariant message; no raw exception detail, no PHI.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrameworkErrorResponse"
  /audit/events:
    get:
      operationId: getAuditEvents
      tags:
        - audit
      summary: Return recent audit events with hash chain verification
      description: "Requires audit-log:read scope. Returns a display projection (IDs only, no PHI names) ordered by wallClock
        desc, plus a hash chain verification over all stored events. Must use Cache-Control: no-store."
      x-yrese-ssot: SCR-028
      x-yrese-required-scope: audit-log:read
      parameters:
        - in: query
          name: limit
          schema:
            default: 50
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Audit events and chain verification
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogResponse"
        "400":
          description: Invalid audit log query (AUD-0001)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden (AUTH-0003)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Normalized internal error. Constant invariant message; no raw exception detail, no PHI.
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrameworkErrorResponse"
