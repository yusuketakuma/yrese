      summary: Read one immutable prescription version
      description: "WP-7403 (DOM-002 §4). Requires prescription:read, reception:read, and patient:read. Superseded versions
        remain readable; an absent version is reported as not found. Contains clinical PHI. Every status uses
        Cache-Control: no-store."
      x-yrese-ssot: DOM-002
      x-yrese-required-scopes:
        - prescription:read
        - reception:read
        - patient:read
      parameters:
        - in: path
          name: prescriptionId
          schema:
            type: string
            minLength: 1
            maxLength: 128
          required: true
        - in: path
          name: version
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
          required: true
      responses:
        "200":
          description: Immutable version snapshot
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrescriptionVersionView"
        "400":
          description: Invalid prescription read request (RX-0005)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden (AUTH-0003)
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Prescription or version not found in scope (RX-0006)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Normalized internal error. Constant invariant message; no raw exception detail, no PHI.
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrameworkErrorResponse"
  /dispensings:
    post:
      operationId: createDispensingRecord
      tags:
        - dispensing
      summary: Record dispensing execution against a finalized prescription version
      description: "WP-7404 (DOM-002 §5, DOM-004 §1, API-021). Requires dispensing:write scope. The target prescription
        version is explicit and must be finalized; open inquiries block creation (DSP-0001), one record per prescription
        version (DSP-0007), items must cover every rpItem exactly once (DSP-0005), and generic substitution requires the
        source item's genericSubstitutionPermitted plus matching genericNameCode (DSP-0004). Idempotency-Key is
        required; replaying the same key with an identical payload returns the stored record. Every status uses
        Cache-Control: no-store."
      x-yrese-ssot: API-021
      x-yrese-required-scopes:
        - dispensing:write
      parameters:
        - in: header
          name: idempotency-key
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{16,128}$
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispensingRecordCreateRequest"
      responses:
        "200":
          description: Idempotent replay of the stored dispensing record
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispensingRecordCreateResponse"
        "201":
          description: Dispensing record created (status null until confirmation)
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispensingRecordCreateResponse"
        "400":
          description: Invalid dispensing request (DSP-0005)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden (AUTH-0003)
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Prescription or finalized version not found in scope (DSP-0003)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Dispensing guard failed (DSP-0001/DSP-0004/DSP-0007/DSP-0008)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Normalized internal error. Constant invariant message; no raw exception detail, no PHI.
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrameworkErrorResponse"
  /dispensings/{dispensingId}/confirm:
    post:
      operationId: confirmDispensingRecord
      tags:
        - dispensing
      summary: Confirm a dispensing record (DISPENSING_RECORDED) by a qualified pharmacist
      description: "WP-7404 (DOM-004 §1, SEC-010, API-021). Requires dispensing:confirm scope and an active pharmacist
        qualification evidence record; qualification is evaluated before existence. The status transition, audit event,
        and dispense.confirmed outbox intent commit in one transaction; records are immutable after confirmation.
        Idempotency-Key is required; replaying the same key returns the stored view, a different key on a confirmed
        record is an invalid transition (DSP-0002), and a key already used to confirm another record conflicts
        (DSP-0008). Every status uses Cache-Control: no-store."
      x-yrese-ssot: API-021
      x-yrese-required-scopes:
        - dispensing:confirm
      parameters:
        - in: path
          name: dispensingId
          schema:
            type: string
            minLength: 1
            maxLength: 128
          required: true
        - in: header
          name: idempotency-key
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{16,128}$
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispensingConfirmRequest"
      responses:
        "200":
          description: Dispensing confirmed (or replayed idempotent view)
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispensingConfirmResponse"
        "400":
          description: Invalid dispensing request (DSP-0005)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden (AUTH-0003)
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Dispensing record not found in scope (DSP-0003)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Invalid lifecycle transition (DSP-0002) or confirm idempotency conflict (DSP-0008)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Normalized internal error. Constant invariant message; no raw exception detail, no PHI.
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrameworkErrorResponse"
  /operations/outbox-summary:
    get:
      operationId: getOperationsOutboxSummary
      tags:
        - operations
      summary: Return transactional outbox counters for the authenticated tenant and pharmacy
      description: "Requires sync:read scope. Returns counts and instants derived from persisted outbox intents
        (migrations/000005 + 000007 `outbox_events`; the in-memory mode reads the in-process intent store). No delivery
        worker runs in this slice, so intents observed as pending are genuinely pending. The response is PHI-free —
        counts, event-type labels, and one instant only — so it declares no Cache-Control: no-store. `legacyOrphanCount`
        is omitted where it is not derived rather than reported as zero, and the orphan reception IDs themselves are
        never returned."
      x-yrese-ssot: MOD-009
      x-yrese-required-scope: sync:read
      responses:
        "200":
          description: Outbox counters grouped by event type in eventType asc order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboxSummaryResponse"
        "403":
          description: Forbidden (AUTH-0003)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Normalized internal error. Constant invariant message; no raw exception detail, no PHI.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrameworkErrorResponse"
  /operations/reception-summary:
    get:
      operationId: getOperationsReceptionSummary
      tags:
        - operations
      summary: Return reception counts for one explicit calendar date
      description: "Requires reception:read only. patient:read is deliberately not required: the service folds the reception
        list into counts before the route sees it, so no patient identity crosses the route boundary and a batch screen
        does not need a patient scope. Both count arrays list every enum member in declaration order, so an absent
        status is reported as a measured zero rather than being dropped. The response is PHI-free and declares no
        Cache-Control: no-store."
      x-yrese-ssot: API-006
      x-yrese-required-scope: reception:read
      parameters:
        - in: query
          name: date
          schema:
            type: string
            format: date
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
          required: true
      responses:
        "200":
          description: Reception counts by reception status and eligibility status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceptionSummaryResponse"
        "400":
          description: Invalid reception summary query (RCV-0001)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden (AUTH-0003)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Normalized internal error. Constant invariant message; no raw exception detail, no PHI.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrameworkErrorResponse"
  /operations/migration-state:
    get:
      operationId: getOperationsMigrationState
      tags:
        - operations
      summary: Return the schema_migrations reconciliation state
      description: "Requires tenant:admin scope. Reuses the same reconciliation the db:check CLI and the startup gate use
        (checkMigrationState over migrations/000001 `schema_migrations`). Returns the reconciliation result,
        applied/available counts, the derived pending versions, and the latest applied version and name.
        `pendingVersions` is omitted where the reconciliation stopped before it could be derived rather than reported as
        zero. Never returns DATABASE_URL, a connection string, a host name, or a checksum value. When no persistent
        store is configured the response is the explicit `available: false` branch rather than a fabricated up-to-date
        state."
      x-yrese-ssot: DB-002
      x-yrese-required-scope: tenant:admin
      responses:
        "200":
          description: Migration reconciliation state, or the explicit not-configured branch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationStateResponse"
        "403":
          description: Forbidden (AUTH-0003)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Normalized internal error. Constant invariant message; no raw exception detail, no PHI.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrameworkErrorResponse"
  /audit/events:
    get:
      operationId: getAuditEvents
      tags:
        - audit
      summary: Return recent audit events with hash chain verification
      description: "Requires audit-log:read scope. Returns a display projection (IDs only, no PHI names) ordered by wallClock
        desc, plus a hash chain verification over all stored events. Must use Cache-Control: no-store."
      x-yrese-ssot: SCR-028
      x-yrese-required-scope: audit-log:read
      parameters:
        - in: query
          name: limit
          schema:
            default: 50
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Audit events and chain verification
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogResponse"
        "400":
          description: Invalid audit log query (AUD-0001)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden (AUTH-0003)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Normalized internal error. Constant invariant message; no raw exception detail, no PHI.
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrameworkErrorResponse"
components:
  schemas:
    PatientCreateRequest:
