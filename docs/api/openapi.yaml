      description: Prescription draft save result, including created/updated/unchanged disposition. Contains clinical PHI.
    OutboxSummaryResponse:
      type: object
      properties:
        pendingCount:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        deliveredCount:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        oldestPendingCreatedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        byEventType:
          type: array
          items:
            type: object
            properties:
              eventType:
                type: string
                minLength: 1
                maxLength: 128
              pendingCount:
                type: integer
                minimum: 0
                maximum: 9007199254740991
              deliveredCount:
                type: integer
                minimum: 0
                maximum: 9007199254740991
            required:
              - eventType
              - pendingCount
              - deliveredCount
            additionalProperties: false
        legacyOrphanCount:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
        - pendingCount
        - deliveredCount
        - byEventType
      additionalProperties: false
      description: "Transactional outbox counters and instants only (pending/delivered per event type, oldest pending
        instant). PHI-free: no reception, patient, or payload content. `legacyOrphanCount` is present only where it was
        actually derived; an omitted field means not derived, which is not the same as zero."
    ReceptionSummaryResponse:
      type: object
      properties:
        date:
          type: string
          format: date
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
        totalCount:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        byReceptionStatus:
          type: array
          items:
            type: object
            properties:
              status:
                type: string
                enum:
                  - WAITING
                  - IN_PROGRESS
                  - COMPLETED
                  - CANCELLED
              count:
                type: integer
                minimum: 0
                maximum: 9007199254740991
            required:
              - status
              - count
            additionalProperties: false
        byEligibilityStatus:
          type: array
          items:
            type: object
            properties:
              status:
                type: string
                enum:
                  - VERIFIED
                  - PENDING_REVERIFY
                  - LOCAL_ONLY_UNVERIFIED
                  - NOT_CHECKED
              count:
                type: integer
                minimum: 0
                maximum: 9007199254740991
            required:
              - status
              - count
            additionalProperties: false
      required:
        - date
        - totalCount
        - byReceptionStatus
        - byEligibilityStatus
      additionalProperties: false
      description: "Reception counts for one business date, folded before leaving the service. Every reception status and
        eligibility status member is listed in declaration order; a zero is a measured count, not a placeholder.
        PHI-free: no patient identity is enumerated."
    MigrationStateResponse:
      oneOf:
        - type: object
          properties:
            available:
              type: boolean
              const: true
            result:
              type: string
              enum:
                - up_to_date
                - db_ahead
                - version_mismatch
                - checksum_mismatch
                - name_mismatch
                - unapplied_required
            appliedCount:
              type: integer
              minimum: 0
              maximum: 9007199254740991
            availableCount:
              type: integer
              minimum: 0
              maximum: 9007199254740991
            pendingVersions:
              type: array
              items:
                type: string
                pattern: ^\d{6}$
            latestAppliedVersion:
              type: string
              pattern: ^\d{6}$
            latestAppliedName:
              type: string
              minLength: 1
              maxLength: 128
              pattern: ^[a-z0-9_]+$
          required:
            - available
            - result
            - appliedCount
            - availableCount
          additionalProperties: false
        - type: object
          properties:
            available:
              type: boolean
              const: false
            reason:
              type: string
              const: PERSISTENT_STORE_NOT_CONFIGURED
          required:
            - available
            - reason
          additionalProperties: false
      description: "schema_migrations reconciliation state. Carries the reconciliation result, counts, pending versions, and
        the latest applied version/name only — never a connection string, host name, or checksum value (a checksum
        difference appears solely as the `checksum_mismatch` result). `pendingVersions` is present only where it was
        actually derived (`up_to_date`/`db_ahead` carry a measured empty list, `unapplied_required` the pending
        versions); a mismatch result stops the reconciliation part-way and omits the field, which is not the same as
        zero. The `available: false` branch is returned when no persistent store is configured."
      type: object
    AuditLogResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            type: object
            properties:
              eventId:
                type: string
                minLength: 1
                maxLength: 128
              wallClock:
                type: string
                format: date-time
                pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
              actorId:
                type: string
                minLength: 1
                maxLength: 128
              auditEventType:
                type: string
                pattern: ^[a-z][a-z0-9]*(?:_[a-z0-9]+)*(?:\.[a-z][a-z0-9]*(?:_[a-z0-9]+)*){1,2}$
              targetRef:
                type: object
                properties:
                  kind:
                    type: string
                    minLength: 1
                    maxLength: 64
                  id:
                    type: string
                    minLength: 1
                    maxLength: 128
                required:
                  - kind
                  - id
                additionalProperties: false
              outcome:
                type: string
                enum:
                  - success
                  - denied
                  - failed
              reasonCode:
                type: string
                minLength: 1
                maxLength: 64
              businessReasonCode:
                type: string
                minLength: 1
                maxLength: 64
            required:
              - eventId
              - wallClock
              - actorId
              - auditEventType
              - targetRef
              - outcome
            additionalProperties: false
        chainVerification:
          oneOf:
            - type: object
              properties:
                ok:
                  type: boolean
                  const: true
                checkedCount:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
              required:
                - ok
                - checkedCount
              additionalProperties: false
            - type: object
              properties:
                ok:
                  type: boolean
                  const: false
                checkedCount:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                breakIndex:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                reason:
                  type: string
                  enum:
                    - prev_hash_mismatch
                    - entry_hash_mismatch
                    - hash_format_invalid
              required:
                - ok
                - checkedCount
                - breakIndex
                - reason
              additionalProperties: false
          type: object
        totalCount:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
        - entries
        - chainVerification
        - totalCount
      additionalProperties: false
      description: Audit log display projection (who/when/what) with hash chain verification. IDs only; no PHI names.
