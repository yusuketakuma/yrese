            rows:
              minItems: 1
              maxItems: 100
              type: array
              items:
                type: object
                properties:
                  sequence:
                    type: integer
                    minimum: 1
                    maximum: 100
                  drugText:
                    type: string
                    maxLength: 256
                  usageText:
                    type: string
                    maxLength: 256
                  days:
                    anyOf:
                      - type: integer
                        minimum: 1
                        maximum: 999
                      - type: "null"
                  quantityText:
                    type: string
                    maxLength: 64
                required:
                  - sequence
                  - drugText
                  - usageText
                  - days
                  - quantityText
